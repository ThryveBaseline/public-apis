[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpt"
version = "0.1.0"
description = "Replication of JJ Simon's Fair Pricing Theory NQ method, risk model and multi-account prop firm operation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.2", "tabulate>=0.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fpt = "fpt.cli:main"

[tool.setuptools.packages.find]
include = ["fpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
